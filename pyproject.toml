[project]
name = "kitten-tts-server"
version = "0.1.0"
description = "KittenTTS server and ai-chat-data-server tool (CPU)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "onnxruntime",
    "soundfile",
    "numpy",
    "huggingface_hub",
    "phonemizer",
    "misaki[en]>=0.9.4",
    "espeakng_loader==0.2.0",
    "PyYAML",
    "python-multipart",
    "requests",
    "Jinja2",
    "watchdog",
    "aiofiles",
    "unidecode",
    "inflect",
    "tqdm",
    "hf-transfer",
    "pydub",
    "librosa",
    "praat-parselmouth",
    "torch",
    "torchaudio",
]

[tool.uv]
package = false
